services:
  mega_postgres:
    image: postgres:15
    container_name: mega_postgres
    environment:
      POSTGRES_DB: mega
      POSTGRES_USER: mega
      POSTGRES_PASSWORD: Admin123
    ports:
      - 5432:5432
    volumes:
      - /var/lib/mega/postgres:/var/lib/postgresql/data
      # - postgres_data:/var/lib/postgresql/data
    networks:
      mega_network:
  mega_app:
    image: gaborbozo/mega:latest
    container_name: mega_app
    depends_on:
      - mega_postgres
    ports:
      - 8080:8080
    networks:
      - mega_network
    env_file:
      - ./config.env
  mega_caddy:
    image: caddy:2
    depends_on:
      - mega_postgres
      - mega_app
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - mega_network
  mega_prometheus:
    image: prom/prometheus:latest
    container_name: mega_prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mega_network
  mega_grafana:
    image: grafana/grafana-oss:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mega
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - /var/lib/mega/grafana:/var/lib/grafana
      # - grafana_data:/var/lib/grafana
    networks:
      - mega_network

networks:
  mega_network:

