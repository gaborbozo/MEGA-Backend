services:
  mega-postgres:
    image: postgres:15
    container_name: mega-postgres
    environment:
      POSTGRES_DB: mega
      POSTGRES_USER: mega
      POSTGRES_PASSWORD: Admin123
    ports:
      - 5432:5432
    volumes:
      - /var/lib/mega/postgres:/var/lib/postgresql/data
      # - postgres_data:/var/lib/postgresql/data
    networks:
      mega-network:
  mega-app:
    image: gaborbozo/mega:latest
    container_name: mega-app
    depends_on:
      - mega-postgres
    ports:
      - 8080:8080
    networks:
      - mega-network
    env_file:
      - ./config.env
  mega-caddy:
    image: caddy:2
    container_name: mega-caddy
    depends_on:
      - mega-postgres
      - mega-app
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - mega-network
  mega-prometheus:
    image: prom/prometheus:latest
    container_name: mega-prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mega-network
  mega-grafana:
    image: grafana/grafana-oss:latest
    container_name: mega-grafana
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=mega
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - /var/lib/mega/grafana:/var/lib/grafana
      # - grafana_data:/var/lib/grafana
    networks:
      - mega-network

networks:
  mega-network:

