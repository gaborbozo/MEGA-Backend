name: Build and Publish Docker Image to GCP Artifact Repository

on:
  push:
  workflow_dispatch:

env:
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_AR_LOCATION: ${{ vars.GCP_AR_LOCATION }}
  GCP_AR_URL: ${{ vars.GCP_AR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
          cache: gradle

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Build application
        run: ./gradlew clean bootJar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: |
          gcloud auth configure-docker \
            ${{ env.GCP_AR_LOCATION }}-docker.pkg.dev \
            --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./env/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GCP_AR_URL }}/mega-docker/mega-backend:latest
            ${{ env.GCP_AR_URL }}/mega-docker/mega-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
